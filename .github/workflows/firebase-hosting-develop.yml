# Deploy develop branch to Firebase Preview Channel
# This creates a preview URL that you can test before merging to main

name: Deploy to Firebase Preview (develop)
on:
  push:
    branches:
      - develop
permissions:
  contents: read
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git commit hash
      
      - name: Update cache-busting version
        run: |
          chmod +x update-cache-version.sh
          ./update-cache-version.sh
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Deploy to Firebase Preview Channel
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GABLERAJ }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > $HOME/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json
          firebase use gableraj --non-interactive
          firebase hosting:channel:deploy develop-preview --only hosting --non-interactive
          echo "✅ Preview deployed successfully!"
          echo "🌐 Preview URL: https://gableraj--develop-preview.web.app"
