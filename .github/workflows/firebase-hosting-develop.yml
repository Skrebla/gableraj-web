# Deploy develop branch to Firebase Preview Channel
# This creates a preview URL that you can test before merging to main

name: Deploy to Firebase Preview (develop)
on:
  push:
    branches:
      - develop
permissions:
  contents: read
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git commit hash
      
      - name: Update cache-busting version
        run: |
          chmod +x update-cache-version.sh
          ./update-cache-version.sh
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest
      
      - name: Deploy to Firebase Preview Channel
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GABLERAJ }}
        run: |
          set -e  # Exit on error
          
          # Write service account (handle both base64 and plain JSON)
          if echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > /tmp/sa.json 2>/dev/null; then
            mv /tmp/sa.json $HOME/firebase-service-account.json
            echo "✓ Service account decoded from base64"
          else
            echo "$FIREBASE_SERVICE_ACCOUNT" > $HOME/firebase-service-account.json
            echo "✓ Service account written as JSON"
          fi
          
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json
          
          echo "Setting Firebase project to gableraj..."
          firebase use gableraj --non-interactive
          
          echo "Verifying firebase.json exists and is valid..."
          ls -la firebase.json
          cat firebase.json | head -20
          
          echo "Checking Firebase project configuration..."
          firebase projects:list
          
          echo "Deploying to preview channel 'develop-preview'..."
          firebase hosting:channel:deploy develop-preview --non-interactive
          
          echo ""
          echo "✅ Deployment successful!"
          echo ""
          echo "🌐 Preview URL: https://gableraj--develop-preview.web.app"
          echo "📋 Check the output above for the actual preview URL if different"
          echo ""
          echo "Note: Firebase Auth warnings are normal and don't affect hosting deployment"
